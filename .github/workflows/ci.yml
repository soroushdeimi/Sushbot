name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Required for uploading SARIF to GitHub Security tab
permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  POSTGRES_DB: test_sushbotseller

jobs:
  # =========================================================================
  # Stage 1: Lint & Security
  # =========================================================================
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit[toml] bandit-sarif-formatter mypy

      - name: Ruff Lint
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Bandit Security Scan
        run: |
          bandit -c pyproject.toml -r . -f sarif -o bandit.sarif --exit-zero || true
          bandit -c pyproject.toml -r . -ll || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('bandit.sarif') != ''
        with:
          sarif_file: bandit.sarif
        continue-on-error: true

  # =========================================================================
  # Stage 2: Type Check
  # =========================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: MyPy
        run: mypy . --config-file=pyproject.toml || true

  # =========================================================================
  # Stage 3: Tests
  # =========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          BOT_TOKEN: "test:token"
          SUPER_ADMIN_TELEGRAM_ID: "12345"
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -n auto \
            --cov=. \
            --cov-report=xml \
            --cov-fail-under=80 || true

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false


